<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抖音订单看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="dashboard_data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --yellow:#fec56d; --peach:#ffb38a; --blue:#a0e3ff; --pink:#f79cc1;
  --mint:#91f9d3; --lav:#c6deff; --coral:#fb9d79; --lem:#fff3c9;
  --ink:#4a3f35; --ink2:#9a8b7d; --ink3:#c9bdb0;
  --card:#ffffff; --radius:18px;
  --shadow:0 8px 24px rgba(160,120,80,.10);
  --shadow-lg:0 14px 40px rgba(120,90,60,.16);
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#faf6f1;color:var(--ink);min-height:100vh;overflow-x:hidden}
.bg-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;pointer-events:none}
.bg-blob.b1{width:440px;height:440px;background:#ffd9a0;top:-140px;right:-90px}
.bg-blob.b2{width:400px;height:400px;background:#b8e6ff;top:28%;left:-160px}
.bg-blob.b3{width:360px;height:360px;background:#ffc9de;bottom:-120px;right:24%}
.bg-blob.b4{width:320px;height:320px;background:#c9f5d8;bottom:6%;left:26%}
.hero{position:relative;z-index:1;background:linear-gradient(120deg,#ffd9a0 0%,#ffc2d1 48%,#b8e6ff 100%);padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero h1{font-size:1.75em;font-weight:800;color:#5b4636;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.hero .sub{margin-top:5px;font-size:.84em;color:#6b5a4a;opacity:.9}
.hero-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border-radius:14px;padding:6px 12px;font-size:.8em;color:#6b5a4a;font-weight:600}
.container{position:relative;z-index:1;max-width:1520px;margin:0 auto;padding:18px 20px 80px}
.panel{background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none}
.panel-head h2{font-size:1.02em;font-weight:800;color:#6b5a4a}
.panel-head .arrow{transition:transform .25s;color:var(--ink2);font-size:.9em}
.panel.collapsed .collapse-body{display:none}
.panel.collapsed .arrow{transform:rotate(-90deg)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat-card{border-radius:var(--radius);padding:18px 20px;color:#5b4636;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.stat-card::after{content:"";position:absolute;right:-22px;top:-22px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.35)}
.stat-card .icon{font-size:1.5em;margin-bottom:4px}
.stat-card .value{font-size:1.65em;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-card .label{font-size:.78em;font-weight:700;opacity:.75;margin-top:2px}
.stat-c-orders{background:linear-gradient(135deg,#d3fbd9,#91f9d3)}
.stat-c-amount{background:linear-gradient(135deg,#ffe3ae,#fec56d)}
.stat-c-avg{background:linear-gradient(135deg,#d8eeff,#a0e3ff)}
.stat-c-stores{background:linear-gradient(135deg,#ffd9e7,#f79cc1)}
.quick-dates{display:flex;gap:8px;flex-wrap:wrap}
.qd{padding:7px 15px;border:none;border-radius:20px;background:#f5efe8;color:#6b5a4a;font-size:.82em;font-weight:700;cursor:pointer;transition:all .2s}
.qd:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(160,120,80,.15)}
.qd.active{background:linear-gradient(120deg,#fec56d,#ff9f9f);color:#fff;box-shadow:0 4px 12px rgba(254,197,109,.45)}
.filter-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:14px}
.filter-group{display:flex;flex-direction:column;gap:5px;min-width:130px;flex:1}
.filter-group label{font-size:.76em;color:var(--ink2);font-weight:700}
.filter-group select,.filter-group input{padding:8px 10px;border:1.5px solid #eee2d4;border-radius:10px;font-size:.85em;background:#fffdf9;color:var(--ink);outline:none;transition:border-color .15s}
.filter-group select:focus,.filter-group input:focus{border-color:var(--yellow)}
.btn{padding:8px 16px;border:none;border-radius:11px;font-size:.84em;font-weight:700;cursor:pointer;transition:all .18s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(120deg,#fec56d,#ff9f9f);color:#5b4636;box-shadow:0 4px 12px rgba(254,197,109,.4)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(254,197,109,.5)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-secondary{background:#f2eae0;color:#6b5a4a}
.btn-secondary:hover{background:#ecdfd0}
.btn-ghost{background:transparent;color:#8a7a6a;border:1.5px solid #e5d8c8}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .selected-info{font-size:.85em;color:var(--ink2);font-weight:600}
.toolbar .sep{width:1px;height:24px;background:#eee2d4;margin:0 4px}
.flag-btn{width:30px;height:30px;border-radius:50%;border:3px solid #fff;cursor:pointer;transition:all .18s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.flag-btn:hover{transform:scale(1.18)}
.flag-btn.active{border-color:#5b4636;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(91,70,54,.5)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-box{background:rgba(255,255,255,.93);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.chart-box h3{font-size:.92em;font-weight:800;color:#6b5a4a;margin-bottom:12px}
.chart-wrap{position:relative;height:260px}
.table-section{padding:0;overflow:hidden}
.table-wrap{overflow-x:auto;max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.82em}
th{background:#faf4ec;padding:10px 10px;text-align:left;font-weight:700;color:#9a8b7d;position:sticky;top:0;cursor:pointer;border-bottom:1px solid #f0e3d3;z-index:2;white-space:nowrap}
th.sorted{color:#e08a2e}
td{padding:9px 10px;border-bottom:1px solid #f6f0e8;vertical-align:top}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:#fff7ec}
tbody tr.selected{background:#ffe9cf}
.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72em;font-weight:800;white-space:nowrap}
.status-shipped{background:#d9f7e3;color:#1f8a4c}
.status-refunded{background:#ffe8d0;color:#d97b1f}
.status-closed{background:#ffe1e1;color:#cf3f3f}
.status-pushed{background:#ddecff;color:#3a6fd8}
.status-cancelled{background:#eceff1;color:#7a8694}
.amount-cell{font-weight:800;color:#e08a2e;white-space:nowrap}
.prod-cell{display:flex;align-items:center;gap:8px;min-width:170px;max-width:240px}
.prod-img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid #f0e3d3;background:#fff}
.prod-info{min-width:0}
.prod-title{font-size:.78em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-spec{font-size:.7em;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-cell{min-width:210px;max-width:300px}
.note-line{display:flex;align-items:baseline;gap:6px;padding:2px 0;font-size:.76em}
.note-tag{flex-shrink:0;font-size:.62em;font-weight:800;padding:1px 5px;border-radius:6px}
.note-tag.buyer{background:#ddecff;color:#3a6fd8}
.note-tag.seller{background:#ffe8d0;color:#d97b1f}
.note-tag.system{background:#f0e7ff;color:#8b5cf6}
.note-text{min-width:0;word-break:break-all;white-space:pre-wrap;color:var(--ink);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.note-text.empty{color:var(--ink3);font-style:italic}
.flag-dot{display:inline-block;width:13px;height:13px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.12);transition:transform .15s;flex-shrink:0}
.flag-dot:hover{transform:scale(1.35)}
.chk{width:16px;height:16px;accent-color:#f08c2e;cursor:pointer}
.empty-tip{text-align:center;padding:36px;color:var(--ink3);font-size:.9em}
.flag-picker{position:absolute;background:#fff;border:1px solid #f0e3d3;border-radius:14px;padding:8px;box-shadow:var(--shadow-lg);z-index:9999;display:none}
.flag-picker.show{display:flex;gap:6px}
.flag-picker .fp-color{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #fff;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.flag-picker .fp-color:hover{transform:scale(1.25)}
.sync-status{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;font-size:.85em;font-weight:700;z-index:5000;display:none;box-shadow:var(--shadow-lg)}
.sync-status.show{display:block;animation:toastIn .25s}
.sync-info{background:#4a7dd6;color:#fff}
.sync-success{background:#2e9e5b;color:#fff}
.sync-error{background:#cf3f3f;color:#fff}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.change-badge{background:#ff9f9f;color:#fff;border-radius:10px;padding:2px 8px;font-size:.75em;font-weight:800}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100vw);background:#fffdf9;box-shadow:-10px 0 34px rgba(90,60,40,.18);z-index:1000;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.25,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:linear-gradient(120deg,#ffe3ae,#ffc9de,#c9ecff);border-bottom:1px solid #f0e3d3}
.drawer-title{font-size:1.05em;font-weight:800;color:#5b4636}
.drawer-sub{font-size:.74em;color:#8a7a6a;margin-top:3px;word-break:break-all}
.drawer-close{width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.6);font-size:1.2em;cursor:pointer;color:#6b5a4a;transition:all .15s}
.drawer-close:hover{background:#fff;transform:rotate(90deg)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid #f0e3d3;background:#fff}
.d-prod{display:flex;gap:12px;background:#fff;border:1px solid #f0e3d3;border-radius:14px;padding:12px;margin-bottom:10px}
.d-prod img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid #f0e3d3}
.d-prod .t{font-size:.85em;font-weight:600;line-height:1.35}
.d-prod .s{font-size:.75em;color:var(--ink3);margin-top:3px}
.d-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;background:#fff;border:1px solid #f0e3d3;border-radius:14px;padding:12px;margin-bottom:12px}
.d-info .k{font-size:.72em;color:var(--ink3);font-weight:700}
.d-info .v{font-size:.84em;font-weight:600;word-break:break-all}
.d-note{margin-bottom:12px}
.d-note-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.d-note-head .label{font-size:.8em;font-weight:800;color:#6b5a4a}
.d-note textarea{width:100%;min-height:64px;padding:10px;border:1.5px solid #eee2d4;border-radius:12px;font-size:.85em;line-height:1.5;resize:vertical;outline:none;background:#fff;color:var(--ink);font-family:inherit}
.d-note textarea:focus{border-color:var(--yellow)}
.d-note .hint{font-size:.7em;color:var(--ink3);margin-top:4px}
.drawer-changed{font-size:.8em;color:#d97b1f;font-weight:700}
/* responsive */
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  body{font-size:14px}
  .hero{padding:16px 14px}
  .hero h1{font-size:1.25em}
  .container{padding:12px 10px 60px}
  .panel{padding:14px}
  .filter-group{min-width:0;flex:1 1 calc(50% - 8px)}
  .filter-group.full{flex:1 1 100%}
  .quick-dates{gap:6px}
  .qd{padding:7px 12px;font-size:.76em;min-height:34px}
  .charts{grid-template-columns:1fr}
  .chart-wrap{height:220px}
  .stat-card{padding:14px}
  .stat-card .value{font-size:1.3em}
  .toolbar{gap:8px}
  .toolbar .sep{display:none}
  table{font-size:.74em}
  th,td{padding:7px 5px}
  .note-cell{min-width:150px;max-width:180px}
  .prod-cell{min-width:130px;max-width:160px}
  .prod-img{width:36px;height:36px}
  .drawer{width:100vw}
}
@media(max-width:400px){
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .filter-group{flex:1 1 100%}
  .hero-actions{width:100%}
  .hero-actions .btn,.hero-actions .pill{flex:1;justify-content:center}
  .d-info{grid-template-columns:1fr}
}</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div class="bg-blob b4"></div>
<header class="hero">
  <div>
    <h1>🛍️ 抖音订单看板</h1>
    <div class="sub">勾选订单批量设旗 · 点击行看详情 · 备注修改后点「同步到 ERP」实时写回风速分销</div>
  </div>
  <div class="hero-actions">
    <span class="pill" id="lastUpdate"></span>
    <span class="pill" id="changeCount" style="display:none"></span>
    <a class="btn btn-ghost" href="express_stats.html">📦 退货快递统计</a>
    <button class="btn btn-primary" id="syncBtn" disabled>同步到 ERP</button>
  </div>
</header>
<div class="sync-status" id="syncStatus"></div>
<div class="container">
  <div class="stat-grid">
    <div class="stat-card stat-c-orders"><div class="icon">📦</div><div class="value" id="cardOrders">0</div><div class="label">订单数</div></div>
    <div class="stat-card stat-c-amount"><div class="icon">💰</div><div class="value" id="cardAmount">¥0</div><div class="label">总金额</div></div>
    <div class="stat-card stat-c-avg"><div class="icon">📊</div><div class="value" id="cardAvg">¥0</div><div class="label">平均金额</div></div>
    <div class="stat-card stat-c-stores"><div class="icon">🏬</div><div class="value" id="cardStores">0</div><div class="label">店铺数</div></div>
  </div>

  <section class="panel" id="filterPanel">
    <div class="panel-head" onclick="toggleCollapse('filterPanel')">
      <h2>🔍 筛选订单</h2>
      <span class="arrow">▼</span>
    </div>
    <div class="collapse-body">
      <div class="quick-dates">
        <button class="qd" data-range="today">今天</button>
        <button class="qd" data-range="yesterday">昨天</button>
        <button class="qd" data-range="7d">近7天</button>
        <button class="qd" data-range="15d">近15天</button>
        <button class="qd" data-range="30d">近30天</button>
      </div>
      <div class="filter-row">
        <div class="filter-group"><label>开始日期</label><input type="date" id="startDate"></div>
        <div class="filter-group"><label>结束日期</label><input type="date" id="endDate"></div>
        <div class="filter-group"><label>状态</label>
        <select id="statusFilter"><option value="">全部</option><option value="已发货">已发货</option><option value="已发货退款">已发货退款</option><option value="交易关闭">交易关闭</option><option value="已取消">已取消</option><option value="已推送待发货">已推送待发货</option></select>
        </div>
        <div class="filter-group"><label>店铺分组</label><select id="groupFilter"><option value="">全部分组</option></select></div>
        <div class="filter-group"><label>店铺</label><select id="storeFilter"><option value="">全部</option></select></div>
        <div class="filter-group"><label>最小金额</label><input type="number" id="minAmount" placeholder="0"></div>
        <div class="filter-group"><label>最大金额</label><input type="number" id="maxAmount" placeholder="不限"></div>
        <div class="filter-group"><label>搜索</label><input type="text" id="searchInput" placeholder="订单号 / 店铺 / 备注"></div>
        <div class="filter-group"><label>&nbsp;</label><button class="btn btn-primary" id="btnFilter">筛选</button></div>
        <div class="filter-group"><label>&nbsp;</label><button class="btn btn-secondary" id="btnReset">重置</button></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <span class="selected-info">已选 <strong id="selCount" style="color:#e08a2e">0</strong> 条</span>
      <span class="sep"></span>
      <span style="font-size:.8em;color:var(--ink2);font-weight:700">批量设旗:</span>
      <button class="flag-btn" data-flag="0" title="无" style="background:#aaa"></button>
      <button class="flag-btn" data-flag="1" title="红" style="background:#f44336"></button>
      <button class="flag-btn" data-flag="2" title="橙" style="background:#ff9800"></button>
      <button class="flag-btn" data-flag="3" title="黄" style="background:#ffc107"></button>
      <button class="flag-btn" data-flag="4" title="绿" style="background:#00fd28"></button>
      <button class="flag-btn" data-flag="5" title="紫" style="background:#e000fc"></button>
      <span class="sep"></span>
      <span style="font-size:.8em;color:var(--ink2);font-weight:700">应用到:</span>
      <button class="btn btn-secondary" id="btnSetSeller">卖家备注</button>
      <button class="btn btn-secondary" id="btnSetSystem">系统备注</button>
    </div>
  </section>

  <div class="charts">
    <div class="chart-box"><h3>订单状态分布</h3><div class="chart-wrap"><canvas id="statusPie"></canvas></div></div>
    <div class="chart-box"><h3>每日订单趋势</h3><div class="chart-wrap"><canvas id="trendLine"></canvas></div></div>
  </div>

  <section class="panel table-section">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" class="chk" id="chkAll" onclick="event.preventDefault();toggleSelectAll();"></th>
          <th id="th0">日期</th><th id="th1">店铺</th><th id="th2">订单号</th><th>商品</th><th id="th3">状态</th><th id="th4">金额</th>
          <th>备注（买 / 卖 / 系）</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>
</div>

<aside class="drawer" id="detailDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">📋 订单详情</div>
      <div class="drawer-sub" id="drawerOrderId"></div>
    </div>
    <button class="drawer-close" onclick="closeDetail()">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <span class="drawer-changed" id="drawerChanged"></span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" onclick="closeDetail()">关闭</button>
      <button class="btn btn-primary" onclick="syncToERP()">同步到 ERP</button>
    </div>
  </div>
</aside>

<div class="flag-picker" id="flagPicker">
  <div class="fp-color" data-f="0" style="background:#aaa" title="无"></div>
  <div class="fp-color" data-f="1" style="background:#f44336" title="红"></div>
  <div class="fp-color" data-f="2" style="background:#ff9800" title="橙"></div>
  <div class="fp-color" data-f="3" style="background:#ffc107" title="黄"></div>
  <div class="fp-color" data-f="4" style="background:#00fd28" title="绿"></div>
  <div class="fp-color" data-f="5" style="background:#e000fc" title="紫"></div>
</div><script>
var FLAG_COLORS=["#aaa","#f44336","#ff9800","#ffc107","#00fd28","#e000fc"];
var FLAG_NAMES=["无","红","橙","黄","绿","紫"];
var filteredData=[],changes={},sortCol=0,sortAsc=false,charts={};
var selectedIds=new Set(),currentFlag=0,currentDetailId=null;

function getStoreGroup(storeName){
if(!storeName)return "";
for(var g in STORE_GROUPS){
if(STORE_GROUPS[g].indexOf(storeName)>=0)return g;
}
return "未分组";
}
function parseDate(s){return s&&s!=="-"?new Date(s):null;}
function fmtDate(s){return(!s||s==="-")?"-":s.substring(0,10);}
function pad2(n){return n<10?"0"+n:""+n;}
function toLocalDateStr(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function fmtMoney(n){if(!n||isNaN(n))return"¥0.00";return"¥"+Number(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function getStatusClass(s){return s==="已发货"?"status-shipped":s==="已发货退款"?"status-refunded":s==="交易关闭"?"status-closed":s==="已推送待发货"?"status-pushed":s==="已取消"?"status-cancelled":"";}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function initGroups(){
var sel=document.getElementById("groupFilter");
Object.keys(STORE_GROUPS).sort().forEach(function(g){
var o=document.createElement("option");o.value=g;o.textContent=g+" ("+STORE_GROUPS[g].length+")";sel.appendChild(o);
});
var ug=document.createElement("option");ug.value="未分组";ug.textContent="未分组";sel.appendChild(ug);
}
function initStores(groupFilter){
var sels=document.getElementById("storeFilter");
sels.innerHTML="<option value=''>全部</option>";
var stores=[];
if(groupFilter==="未分组"){
var grouped={};for(var g in STORE_GROUPS){STORE_GROUPS[g].forEach(function(s){grouped[s]=1;});}
stores=[...new Set(RAW_DATA.map(function(o){return o.storeName;}))].filter(function(s){return s&&!grouped[s];}).sort();
}else if(groupFilter&&STORE_GROUPS[groupFilter]){
stores=STORE_GROUPS[groupFilter];
}else{
stores=[...new Set(RAW_DATA.map(function(o){return o.storeName;}))].sort();
}
stores.forEach(function(x){
var o=document.createElement("option");o.value=x;o.textContent=x;sels.appendChild(o);
});
}
function setQuickRange(range){
var today=new Date();today.setHours(0,0,0,0);
var sd,ed;
if(range==="today"){sd=new Date(today);ed=new Date(today);}
else if(range==="yesterday"){sd=new Date(today);sd.setDate(sd.getDate()-1);ed=new Date(sd);}
else if(range==="7d"){ed=new Date(today);sd=new Date(today);sd.setDate(sd.getDate()-6);}
else if(range==="15d"){ed=new Date(today);sd=new Date(today);sd.setDate(sd.getDate()-14);}
else if(range==="30d"){ed=new Date(today);sd=new Date(today);sd.setDate(sd.getDate()-29);}
document.getElementById("startDate").value=toLocalDateStr(sd);
document.getElementById("endDate").value=toLocalDateStr(ed);
document.querySelectorAll(".qd").forEach(function(b){b.classList.toggle("active",b.dataset.range===range);});
applyFilters();
}
function applyFilters(){
var sd=document.getElementById("startDate").value;
var ed=document.getElementById("endDate").value;
var st=document.getElementById("statusFilter").value;
var grp=document.getElementById("groupFilter").value;
var sr=document.getElementById("storeFilter").value;
var mn=parseFloat(document.getElementById("minAmount").value)||0;
var mx=parseFloat(document.getElementById("maxAmount").value)||Infinity;
var sc=document.getElementById("searchInput").value.toLowerCase();
filteredData=RAW_DATA.filter(function(o){
var d=parseDate(o.shipTime);
if(sd&&(!d||d<new Date(sd)))return false;
if(ed&&(!d||d>new Date(ed+"T23:59:59")))return false;
if(st&&o.status!==st)return false;
if(grp&&getStoreGroup(o.storeName)!==grp)return false;
if(sr&&o.storeName!==sr)return false;
var a=parseFloat(o.amount)||0;
if(a<mn||a>mx)return false;
if(sc&&!(o.platformOrderId||"").toLowerCase().includes(sc)&&!(o.storeName||"").toLowerCase().includes(sc)&&!(o.buyerNote||"").toLowerCase().includes(sc)&&!(o.sellerNote||"").toLowerCase().includes(sc)&&!(o.systemNote||"").toLowerCase().includes(sc))return false;
return true;
});
sortAndRender();
}
function resetFilters(){
["startDate","endDate","statusFilter","groupFilter","minAmount","maxAmount","searchInput"].forEach(function(i){document.getElementById(i).value="";});
document.getElementById("storeFilter").innerHTML="<option value=''>全部</option>";
initStores("");
document.querySelectorAll(".qd").forEach(function(b){b.classList.remove("active");});
filteredData=[...RAW_DATA];
selectedIds.clear();
sortAndRender();
}
function sortAndRender(){
filteredData.sort(function(a,b){
var va,vb;
switch(sortCol){
case 0:va=a.shipTime||"";vb=b.shipTime||"";break;
case 1:va=a.storeName||"";vb=b.storeName||"";break;
case 2:va=a.platformOrderId||"";vb=b.platformOrderId||"";break;
case 3:va=a.status||"";vb=b.status||"";break;
case 4:va=parseFloat(a.amount)||0;vb=parseFloat(b.amount)||0;break;
default:return 0;
}
return va<vb?(sortAsc?-1:1):va>vb?(sortAsc?1:-1):0;
});
render();
}
function sortTable(c){if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=c===4?false:true;}sortAndRender();}
function render(){renderCards();renderCharts();renderTable();updateChangeCount();}

function renderCards(){

document.getElementById("cardOrders").textContent=t;
document.getElementById("cardAmount").textContent=fmtMoney(am);
document.getElementById("cardAvg").textContent=fmtMoney(ag);

function renderCharts(){

function setFlagColor(f){
currentFlag=f;
document.querySelectorAll(".flag-btn").forEach(function(b){b.classList.toggle("active",parseInt(b.dataset.flag)===f);});
}
function applyFlag(type){
if(!selectedIds.size)return showStatus("请先选择订单","info");
var count=0;
selectedIds.forEach(function(id){
var orig=RAW_DATA.find(function(o){return o.platformOrderId===id;});
var ov=orig?orig[type+"Flag"]:0;
if(currentFlag!==ov){
if(!changes[id])changes[id]={};
changes[id][type+"Flag"]=currentFlag;
count++;
}else if(changes[id]&&changes[id][type+"Flag"]!==undefined){
delete changes[id][type+"Flag"];
if(!Object.keys(changes[id]).length)delete changes[id];
}
});
renderTable();updateChangeCount();
if(currentDetailId){
var o=RAW_DATA.find(function(x){return x.platformOrderId===currentDetailId;});
if(o)renderDrawer(o);
}
showStatus("已设置 "+count+" 条"+(type==="seller"?"卖家":"系统")+"备注旗帜","success");
}

function cycleFlag(oid,type){
var picker=document.getElementById("flagPicker");
var trigger=event.target;
var rect=trigger.getBoundingClientRect();
picker.style.position="fixed";
picker.style.bottom="auto";
if(window.innerWidth<=768){
picker.style.top="auto";picker.style.left="50%";picker.style.bottom="24px";picker.style.transform="translateX(-50%)";
}else{
picker.style.transform="none";
var pw=224;
picker.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-pw-8))+"px";
picker.style.top=(rect.bottom+6)+"px";
}
picker.classList.add("show");
picker.dataset.oid=oid;
picker.dataset.type=type;
}

function syncToERP(){
var cl=Object.entries(changes).map(function(e){return Object.assign({orderId:e[0]},e[1]);});
if(!cl.length)return showStatus("没有修改","info");
if(location.protocol==="http:"||location.protocol==="https:"){
var key=localStorage.getItem("syncKey")||"";
if(!key){key=prompt("首次同步需要输入同步密钥（服务器上运行 pm2 logs order-dashboard 查看）")||"";if(!key)return;localStorage.setItem("syncKey",key);}
showStatus("正在同步到风速分销...","info");
fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json","x-sync-key":key},body:JSON.stringify({changes:cl})})
.then(function(r){if(r.status===403){localStorage.removeItem("syncKey");throw new Error("同步密钥错误，请重新点击同步并输入正确密钥");}return r.json();})
.then(function(res){
if(res.ok===false&&!res.results){showStatus(res.msg||"同步失败","error");return;}
var failMsgs=[];
res.results.forEach(function(r2){
if(r2.ok){
var o=RAW_DATA.find(function(x){return x.platformOrderId===r2.orderId;});
var c=changes[r2.orderId];
if(o&&c){Object.keys(c).forEach(function(k){o[k]=c[k];});}
delete changes[r2.orderId];
}else{failMsgs.push(r2.orderId+":"+r2.msg);}
});
updateChangeCount();renderTable();
if(currentDetailId){
var d=RAW_DATA.find(function(x){return x.platformOrderId===currentDetailId;});
if(d)renderDrawer(d);
}
if(failMsgs.length)showStatus(failMsgs.length+"条未同步："+failMsgs[0],"error");
else showStatus("已同步 "+res.results.length+" 条修改到风速分销","success");
})
.catch(function(e){showStatus(e.message,"error");});
return;
}
var p={action:"sync_notes",changes:cl};
var bl=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
var u=URL.createObjectURL(bl);
var a=document.createElement("a");a.href=u;a.download="sync_"+Date.now()+".json";a.click();
showStatus("已导出"+cl.length+"条修改（本地文件模式无法直接同步）","success");
}

if(Object.keys(changes).length)return;
if(document.activeElement&&document.activeElement.tagName==="TEXTAREA")return;
fetch("dashboard_data.js?t="+Date.now()).then(function(r){return r.text();}).then(function(txt){
var m=txt.match(/window\.RAW_DATA = (\[.*\]);/s);
