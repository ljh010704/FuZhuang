<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抖音订单看板 v4</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="dashboard_data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#fe2c55,#25f4ee);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.4em}
.container{padding:16px}
.filters{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px}
.quick-dates{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.quick-dates .qd{padding:6px 14px;border:1px solid #ddd;border-radius:16px;font-size:.8em;cursor:pointer;background:#fff;transition:all .2s}
.quick-dates .qd:hover{border-color:#fe2c55;color:#fe2c55}
.quick-dates .qd.active{background:#fe2c55;color:#fff;border-color:#fe2c55}
.filter-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.filter-group{display:flex;flex-direction:column;gap:4px;min-width:120px;flex:1}
.filter-group label{font-size:.8em;color:#666;font-weight:600}
.filter-group select,.filter-group input{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:.85em}
.btn{padding:7px 14px;border:none;border-radius:6px;font-size:.85em;font-weight:600;cursor:pointer}
.btn-primary{background:#fe2c55;color:#fff}
.btn-secondary{background:#eee;color:#333}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:10px;padding:14px;text-align:center}
.card .value{font-size:1.5em;font-weight:700;color:#fe2c55}
.card .label{color:#888;font-size:.75em;margin-top:4px}
.toolbar{background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .flag-btn{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s}
.toolbar .flag-btn:hover{transform:scale(1.15)}
.toolbar .flag-btn.active{border-color:#333;box-shadow:0 0 0 2px #fff,0 0 0 4px #333}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-box{background:#fff;border-radius:10px;padding:16px}
.chart-box h3{font-size:.9em;margin-bottom:10px}
.chart-wrap{position:relative;height:250px}
.table-section{background:#fff;border-radius:10px;padding:16px}
.table-wrap{overflow-x:auto;max-height:500px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.82em}
th{background:#f8f9fa;padding:8px;text-align:left;font-weight:600;color:#555;position:sticky;top:0;cursor:pointer;border-bottom:2px solid #eee;z-index:2}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tr.selected{background:#e3f2fd}
.flag-dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:middle;cursor:pointer;border:2px solid rgba(0,0,0,.15);transition:all .15s}
.flag-dot:hover{transform:scale(1.4);border-color:rgba(0,0,0,.5)}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72em;font-weight:600}
.status-shipped{background:#e6f7e6;color:#2e7d32}
.status-refunded{background:#fff3e0;color:#e65100}
.status-closed{background:#ffebee;color:#c62828}
.status-pushed{background:#e3f2fd;color:#1565c0}
.status-cancelled{background:#eceff1;color:#607d8b}
.amount-cell{font-weight:600;color:#fe2c55;white-space:nowrap}
.note-cell{max-width:180px;cursor:pointer}
.prod-cell{display:flex;align-items:center;gap:8px;min-width:150px;max-width:230px}
.prod-img{width:42px;height:42px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid #eee;background:#fafafa}
.prod-info{min-width:0}
.prod-title{font-size:.78em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-spec{font-size:.7em;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-text{display:block;min-height:18px;padding:3px;border-radius:3px;word-break:break-all;white-space:pre-wrap}
.note-text.empty{color:#ccc;font-style:italic;font-size:.8em}
.note-input{width:100%;padding:3px;border:2px solid #fe2c55;border-radius:3px;font-size:1em;box-sizing:border-box;min-height:24px;resize:vertical}
.sync-status{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:6px;font-size:.85em;font-weight:600;z-index:1000;display:none}
.sync-status.show{display:block}
.sync-info{background:#2196f3;color:#fff}
.sync-success{background:#4caf50;color:#fff}
.sync-error{background:#f44336;color:#fff}
.selected-info{font-size:.85em;color:#666}

.flag-picker{position:absolute;background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:9999;display:none}
.flag-picker.show{display:flex;gap:6px}
.flag-picker .fp-color{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.flag-picker .fp-color:hover{transform:scale(1.2);border-color:#333}
.flag-picker .fp-color .fp-label{display:none}


@media (max-width:768px){
  body{font-size:14px}
  .header{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .header h1{font-size:1.1em}
  .header .btn{padding:8px 14px;font-size:.8em;min-height:38px}
  .container{padding:10px}
  .filters{padding:12px}
  .quick-dates{gap:6px}
  .quick-dates .qd{padding:7px 12px;font-size:.78em;min-height:36px}
  .filter-row{gap:8px}
  .filter-group{min-width:0;flex:1 1 calc(50% - 8px)}
  .filter-group[style*="flex:2"]{flex:1 1 100%}
  .filter-group[style*="min-width:auto"]{flex:1 1 calc(50% - 8px)}
  .filter-group select,.filter-group input{min-height:38px;font-size:.85em}
  .btn{min-height:38px;padding:8px 16px;font-size:.85em}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{padding:10px}
  .card .value{font-size:1.2em}
  .toolbar{padding:10px;gap:8px;flex-wrap:wrap}
  .toolbar .flag-btn{width:36px;height:36px;border-width:2px}
  .toolbar .btn{padding:8px 12px;font-size:.8em;min-height:38px}
  .toolbar .selected-info{font-size:.78em}
  .charts{grid-template-columns:1fr;gap:10px}
  .chart-wrap{height:200px}
  .table-section{padding:10px}
  .table-wrap{max-height:400px}
  table{font-size:.75em}
  th{padding:6px 4px;font-size:.85em}
  td{padding:5px 4px}
  .flag-dot{width:20px;height:20px;border-width:2px}
  .note-cell{max-width:120px}
  .status-badge{font-size:.65em;padding:2px 6px}
  .sync-status{top:auto;bottom:16px;left:50%;transform:translateX(-50%);right:auto;width:80%;text-align:center}
  .flag-picker{position:fixed;top:auto;left:50%;bottom:20px;transform:translateX(-50%);padding:12px;gap:10px}
  .flag-picker .fp-color{width:36px;height:36px;border-width:2px}
}

@media (max-width:400px){
  .filter-group{flex:1 1 100%}
  .filter-group[style*="min-width:auto"]{flex:1 1 calc(50% - 8px)}
  .cards{gap:6px}
  .card{padding:8px}
  .card .value{font-size:1em}
  table{font-size:.7em}
  th{padding:5px 3px;font-size:.8em}
  td{padding:4px 3px}
  .note-cell{max-width:100px}
}
</style>
</head>
<body>
<div class="header">
<div><h1>抖音订单统计看板</h1><div style="font-size:.85em;opacity:.8;margin-top:4px">勾选订单 → 选旗帜颜色 → 批量设置旗帜/备注</div></div>
<div style="display:flex;gap:8px;align-items:center">
<span id="lastUpdate" style="font-size:.8em;opacity:.9"></span>
<span id="changeCount" style="font-size:.85em;display:none">0处修改</span>
<button class="btn btn-primary" id="syncBtn" disabled>同步到ERP</button>
<a class="btn btn-secondary" href="express_stats.html" style="text-decoration:none">退货快递统计</a>
</div>
</div>
<div class="sync-status" id="syncStatus"></div>
<div class="container">
<div class="filters">
<div class="quick-dates">
<button class="qd" data-range="today">今天</button>
<button class="qd" data-range="yesterday">昨天</button>
<button class="qd" data-range="7d">近7天</button>
<button class="qd" data-range="15d">近15天</button>
<button class="qd" data-range="30d">近30天</button>
</div>
<div class="filter-row">
<div class="filter-group"><label>开始日期</label><input type="date" id="startDate"></div>
<div class="filter-group"><label>结束日期</label><input type="date" id="endDate"></div>
<div class="filter-group"><label>状态</label>
<select id="statusFilter"><option value="">全部</option><option value="已发货">已发货</option><option value="已发货退款">已发货退款</option><option value="交易关闭">交易关闭</option><option value="已取消">已取消</option><option value="已推送待发货">已推送待发货</option></select>
</div>
<div class="filter-group"><label>店铺分组</label>
<select id="groupFilter"><option value="">全部分组</option></select>
</div>
<div class="filter-group"><label>店铺</label>
<select id="storeFilter"><option value="">全部</option></select>
</div>
<div class="filter-group"><label>最小金额</label><input type="number" id="minAmount" placeholder="0"></div>
<div class="filter-group"><label>最大金额</label><input type="number" id="maxAmount" placeholder="不限"></div>
<div class="filter-group" style="flex:2"><label>搜索</label><input type="text" id="searchInput" placeholder="订单号/店铺/备注"></div>
<div class="filter-group" style="min-width:auto"><label>&nbsp;</label><button class="btn btn-primary" id="btnFilter">筛选</button></div>
<div class="filter-group" style="min-width:auto"><label>&nbsp;</label><button class="btn btn-secondary" id="btnReset">重置</button></div>
</div>
</div>
<div class="toolbar">
<span class="selected-info">已选: <strong id="selCount">0</strong> 条</span>
<span style="margin:0 8px">→ 设置旗帜:</span>
<button class="flag-btn" data-flag="0" title="无" style="background:#aaa"></button>
<button class="flag-btn" data-flag="1" title="红" style="background:#f44336"></button>
<button class="flag-btn" data-flag="2" title="橙" style="background:#ff9800"></button>
<button class="flag-btn" data-flag="3" title="黄" style="background:#ffc107"></button>
<button class="flag-btn" data-flag="4" title="绿" style="background:#00fd28"></button>
<button class="flag-btn" data-flag="5" title="紫" style="background:#e000fc"></button>
<span style="margin-left:8px">应用到:</span>
<button class="btn btn-secondary" id="btnSetSeller">卖家备注</button>
<button class="btn btn-secondary" id="btnSetSystem">系统备注</button>
<span style="margin-left:auto;font-size:.8em;color:#999">提示: 点击旗帜圆点可换色</span>
</div>
<div class="cards">
<div class="card"><div class="value" id="cardOrders">0</div><div class="label">订单数</div></div>
<div class="card"><div class="value" id="cardAmount">¥0</div><div class="label">总金额</div></div>
<div class="card"><div class="value" id="cardAvg">¥0</div><div class="label">平均金额</div></div>
<div class="card"><div class="value" id="cardStores">0</div><div class="label">店铺数</div></div>
</div>
<div class="charts">
<div class="chart-box"><h3>订单状态分布</h3><div class="chart-wrap"><canvas id="statusPie"></canvas></div></div>
<div class="chart-box"><h3>每日订单趋势</h3><div class="chart-wrap"><canvas id="trendLine"></canvas></div></div>
</div>
<div class="table-section">
<div class="table-wrap">
<table>
<thead><tr>
<th style="width:30px"><input type="checkbox" id="chkAll" onclick='event.preventDefault();toggleSelectAll();'></th>
<th id="th0">日期</th><th id="th1">店铺</th><th id="th2">订单号</th><th>商品</th><th id="th3">状态</th><th id="th4">金额</th>
<th>买家备注</th><th>卖家备注</th><th>系统备注</th>
</tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>
</div>

<script>
var FLAG_COLORS=["#aaa","#f44336","#ff9800","#ffc107","#00fd28","#e000fc"];
var FLAG_NAMES=["无","红","橙","黄","绿","紫"];
var filteredData=[],changes={},sortCol=0,sortAsc=false,charts={};
var selectedIds=new Set(),currentFlag=0;

function getStoreGroup(storeName){
if(!storeName)return "";
for(var g in STORE_GROUPS){
if(STORE_GROUPS[g].indexOf(storeName)>=0)return g;
}
return "未分组";
}

function parseDate(s){return s&&s!=="-"?new Date(s):null;}
function fmtDate(s){return(!s||s==="-")?"-":s.substring(0,10);}
function fmtMoney(n){if(!n||isNaN(n))return"¥0.00";return"¥"+Number(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function getStatusClass(s){return s==="已发货"?"status-shipped":s==="已发货退款"?"status-refunded":s==="交易关闭"?"status-closed":s==="已推送待发货"?"status-pushed":s==="已取消"?"status-cancelled":"";}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function initGroups(){
var sel=document.getElementById("groupFilter");
Object.keys(STORE_GROUPS).sort().forEach(function(g){
var o=document.createElement("option");o.value=g;o.textContent=g+" ("+STORE_GROUPS[g].length+")";sel.appendChild(o);
});
var ug=document.createElement("option");ug.value="未分组";ug.textContent="未分组";sel.appendChild(ug);
}

function initStores(groupFilter){
var sels=document.getElementById("storeFilter");
sels.innerHTML="<option value=''>全部</option>";
var stores=[];
if(groupFilter==="未分组"){
var grouped={};for(var g in STORE_GROUPS){STORE_GROUPS[g].forEach(function(s){grouped[s]=1;});}
stores=[...new Set(RAW_DATA.map(o=>o.storeName))].filter(function(s){return s&&!grouped[s];}).sort();
}else if(groupFilter&&STORE_GROUPS[groupFilter]){
stores=STORE_GROUPS[groupFilter];
}else{
stores=[...new Set(RAW_DATA.map(o=>o.storeName))].sort();
}
stores.forEach(function(x){
var o=document.createElement("option");o.value=x;o.textContent=x;sels.appendChild(o);
});
}

function setQuickRange(range){
var today=new Date();
today.setHours(0,0,0,0);
var sd,ed;
if(range==="today"){sd=new Date(today);ed=new Date(today);}
else if(range==="yesterday"){sd=new Date(today);sd.setDate(sd.getDate()-1);ed=new Date(sd);}
else if(range==="7d"){ed=new Date(today);sd=new Date(today);sd.setDate(sd.getDate()-6);}
else if(range==="15d"){ed=new Date(today);sd=new Date(today);sd.setDate(sd.getDate()-14);}
else if(range==="30d"){ed=new Date(today);sd=new Date(today);sd.setDate(sd.getDate()-29);}
document.getElementById("startDate").value=fmtDate(sd.toISOString());
document.getElementById("endDate").value=fmtDate(ed.toISOString());
document.querySelectorAll(".qd").forEach(function(b){b.classList.toggle("active",b.dataset.range===range);});
applyFilters();
}

function applyFilters(){
var sd=document.getElementById("startDate").value;
var ed=document.getElementById("endDate").value;
var st=document.getElementById("statusFilter").value;
var grp=document.getElementById("groupFilter").value;
var sr=document.getElementById("storeFilter").value;
var mn=parseFloat(document.getElementById("minAmount").value)||0;
var mx=parseFloat(document.getElementById("maxAmount").value)||Infinity;
var sc=document.getElementById("searchInput").value.toLowerCase();
filteredData=RAW_DATA.filter(function(o){
var d=parseDate(o.shipTime);
if(sd&&(!d||d<new Date(sd)))return false;
if(ed&&(!d||d>new Date(ed+"T23:59:59")))return false;
if(st&&o.status!==st)return false;
if(grp&&getStoreGroup(o.storeName)!==grp)return false;
if(sr&&o.storeName!==sr)return false;
var a=parseFloat(o.amount)||0;
if(a<mn||a>mx)return false;
if(sc&&!(o.platformOrderId||"").toLowerCase().includes(sc)&&!(o.storeName||"").toLowerCase().includes(sc)&&!(o.buyerNote||"").toLowerCase().includes(sc)&&!(o.sellerNote||"").toLowerCase().includes(sc)&&!(o.systemNote||"").toLowerCase().includes(sc))return false;
return true;
});
sortAndRender();
}

function resetFilters(){
["startDate","endDate","statusFilter","groupFilter","minAmount","maxAmount","searchInput"].forEach(function(i){document.getElementById(i).value="";});
document.getElementById("storeFilter").innerHTML="<option value=''>全部</option>";
initStores("");
document.querySelectorAll(".qd").forEach(function(b){b.classList.remove("active");});
filteredData=[...RAW_DATA];
selectedIds.clear();
sortAndRender();
}

function sortAndRender(){
filteredData.sort(function(a,b){
var va,vb;
switch(sortCol){
case 0:va=a.shipTime||"";vb=b.shipTime||"";break;
case 1:va=a.storeName||"";vb=b.storeName||"";break;
case 2:va=a.platformOrderId||"";vb=b.platformOrderId||"";break;
case 3:va=a.status||"";vb=b.status||"";break;
case 4:va=parseFloat(a.amount)||0;vb=parseFloat(b.amount)||0;break;
default:return 0;
}
return va<vb?(sortAsc?-1:1):va>vb?(sortAsc?1:-1):0;
});
render();
}

function sortTable(c){if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=c===4?false:true;}sortAndRender();}
function render(){renderCards();renderCharts();renderTable();updateChangeCount();}

function renderCards(){
var t=filteredData.length;
var am=filteredData.reduce(function(s,o){return s+(parseFloat(o.amount)||0);},0);
var ag=t?am/t:0;
document.getElementById("cardOrders").textContent=t;
document.getElementById("cardAmount").textContent=fmtMoney(am);
document.getElementById("cardAvg").textContent=fmtMoney(ag);
document.getElementById("cardStores").textContent=new Set(filteredData.map(function(o){return o.storeName;})).size;
}

function renderCharts(){
var sc={};
filteredData.forEach(function(o){sc[o.status]=(sc[o.status]||0)+1;});
if(charts.pie)charts.pie.destroy();
charts.pie=new Chart(document.getElementById("statusPie"),{type:"doughnut",data:{labels:Object.keys(sc),datasets:[{data:Object.values(sc),backgroundColor:["#2e7d32","#e65100","#c62828","#1565c0"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
var dm={};
filteredData.forEach(function(o){var d=fmtDate(o.shipTime);if(!d||d==="-")return;if(!dm[d])dm[d]={c:0,a:0};dm[d].c++;dm[d].a+=parseFloat(o.amount)||0;});
var dt=Object.keys(dm).sort();
if(charts.trend)charts.trend.destroy();
charts.trend=new Chart(document.getElementById("trendLine"),{type:"line",data:{labels:dt,datasets:[{label:"订单数",data:dt.map(function(d){return dm[d].c;}),borderColor:"#fe2c55",backgroundColor:"rgba(254,44,85,.1)",fill:true,tension:.3},{label:"金额",data:dt.map(function(d){return dm[d].a;}),borderColor:"#25f4ee",backgroundColor:"rgba(37,244,238,.1)",fill:true,tension:.3,yAxisID:"y1"}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},scales:{y:{beginAtZero:true,position:"left"},y1:{beginAtZero:true,position:"right",grid:{drawOnChartArea:false}}},plugins:{legend:{position:"top"}}}});
}

function toggleSelect(id){
if(selectedIds.has(id)){selectedIds.delete(id);}else{selectedIds.add(id);}
updateSelCount();renderTable();
}

function toggleSelectAll(){
var allSelected=filteredData.length>0&&filteredData.every(function(o){return selectedIds.has(o.platformOrderId);});
if(allSelected){selectedIds.clear();}
else{filteredData.forEach(function(o){selectedIds.add(o.platformOrderId);});}
updateSelCount();renderTable();
}

function updateSelCount(){document.getElementById("selCount").textContent=selectedIds.size;}

function setFlagColor(f){
currentFlag=f;
document.querySelectorAll(".flag-btn").forEach(function(b){b.classList.toggle("active",parseInt(b.dataset.flag)===f);});
}

function applyFlag(type){
if(!selectedIds.size)return showStatus("请先选择订单","info");
var count=0;
selectedIds.forEach(function(id){
var orig=RAW_DATA.find(function(o){return o.platformOrderId===id;});
var ov=orig?orig[type+"Flag"]:0;
if(currentFlag!==ov){
if(!changes[id])changes[id]={};
changes[id][type+"Flag"]=currentFlag;
count++;
}else if(changes[id]&&changes[id][type+"Flag"]!==undefined){
delete changes[id][type+"Flag"];
if(!Object.keys(changes[id]).length)delete changes[id];
}
});
renderTable();updateChangeCount();
showStatus("已设置 "+count+" 条"+("seller"===type?"卖家":"系统")+"备注旗帜","success");
}

function cycleFlag(oid,type,cf){
  var picker=document.getElementById("flagPicker");
  var trigger=event.target;
  var rect=trigger.getBoundingClientRect();
  if(window.innerWidth<=768){
    picker.style.top="auto";picker.style.left="50%";picker.style.bottom="20px";picker.style.transform="translateX(-50%)";
  }else{
    picker.style.top=(rect.bottom+window.scrollY+4)+"px";
    picker.style.left=rect.left+"px";
    picker.style.bottom="auto";picker.style.transform="none";
  }
  picker.classList.add("show");
  picker.dataset.oid=oid;
  picker.dataset.type=type;
}
function selectFlagColor(f){
  var picker=document.getElementById("flagPicker");
  var oid=picker.dataset.oid;
  var type=picker.dataset.type;
  setFlagSingle(oid,type,f);
  picker.classList.remove("show");
}
document.addEventListener("click",function(e){
  var picker=document.getElementById("flagPicker");
  if(!picker.classList.contains("show"))return;
  if(e.target.closest(".flag-picker"))return;
  if(e.target.classList.contains("flag-dot"))return;
  picker.classList.remove("show");
});
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("fp-color")){
    selectFlagColor(parseInt(t.dataset.f));
  }
});
function setFlagSingle(oid,type,nf){
var o=RAW_DATA.find(function(x){return x.platformOrderId===oid;});
var ov=o?o[type+"Flag"]:0;
if(nf!==ov){if(!changes[oid])changes[oid]={};changes[oid][type+"Flag"]=nf;}
else{if(changes[oid]){delete changes[oid][type+"Flag"];if(!Object.keys(changes[oid]).length)delete changes[oid];}}
renderTable();updateChangeCount();
}

function editNote(oid,t){
var sp=document.getElementById("note-"+t+"-"+oid);
if(!sp||sp.querySelector("textarea"))return;
var ct="";var o=RAW_DATA.find(function(x){return x.platformOrderId===oid;});
if(o)ct=o[t+"Note"]||"";
var ta=document.createElement("textarea");
ta.className="note-input";
ta.value=(changes[oid]&&changes[oid][t+"Note"]!==undefined)?changes[oid][t+"Note"]:ct;
sp.replaceWith(ta);ta.focus();
ta.onblur=function(){saveNote(oid,t,ta.value);};
ta.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ta.blur();}if(e.key==="Escape"){ta.value=ct;ta.blur();}};
}

function saveNote(oid,t,nv){
var o=RAW_DATA.find(function(x){return x.platformOrderId===oid;});
var ov=o?(o[t+"Note"]||""):"";
if(nv!==ov){if(!changes[oid])changes[oid]={};changes[oid][t+"Note"]=nv;}
else{if(changes[oid]){delete changes[oid][t+"Note"];if(!Object.keys(changes[oid]).length)delete changes[oid];}}
renderTable();updateChangeCount();
}

function renderProduct(o){
var ps=o.products||[];
if(!ps.length)return "<span style='color:#ccc;font-size:.75em'>-</span>";
var p=ps[0];
var h="<div class=prod-cell>";
if(p.img)h+="<img class=prod-img referrerpolicy=no-referrer loading=lazy src='"+esc(p.img)+"'>";
h+="<div class=prod-info><div class=prod-title title=\""+esc(p.title||"")+"\">"+esc(p.title||"\u672a\u77e5\u5546\u54c1")+"</div>";
if(p.spec)h+="<div class=prod-spec title=\""+esc(p.spec)+"\">"+esc(p.spec)+"</div>";
h+="</div></div>";
if(ps.length>1)h+="<div style='font-size:.7em;color:#999'>\u7b49"+ps.length+"\u4ef6\u5546\u54c1</div>";
return h;
}
function renderTable(){
var tb=document.getElementById("tableBody");
if(!filteredData.length){tb.innerHTML="<tr><td colspan=10 style=text-align:center;padding:30px;color:#999>暂无数据</td></tr>";return;}
var rows=filteredData;
var h="";
for(var i=0;i<rows.length;i++){
var o=rows[i];
var ch=changes[o.platformOrderId];
var sel=selectedIds.has(o.platformOrderId)?"selected":"";
var sf=(ch&&ch.sellerFlag!==undefined)?ch.sellerFlag:o.sellerFlag;
var syf=(ch&&ch.systemFlag!==undefined)?ch.systemFlag:o.systemFlag;
h+="<tr class='"+sel+"'>";
h+="<td><input type='checkbox' "+(sel?"checked":"")+" value='"+o.platformOrderId+"' onclick='event.preventDefault();toggleSelect(this.value);'></td>";
h+="<td>"+fmtDate(o.shipTime)+"</td>";
h+="<td>"+esc(o.storeName||"")+"</td>";
h+="<td style=font-size:.75em;color:#999>"+esc(o.platformOrderId||"")+"</td>";
h+="<td>"+renderProduct(o)+"</td>";
h+="<td><span class='status-badge "+getStatusClass(o.status)+"'>"+o.status+"</span></td>";
h+="<td class=amount-cell>"+fmtMoney(o.amount)+"</td>";
h+="<td class=note-cell><span class=note-text "+(o.buyerNote?"":"empty")+" id=note-buyer-"+o.platformOrderId+" onclick=editNote('"+o.platformOrderId+"','buyer')>"+esc(o.buyerNote||"点击添加")+(ch&&ch.buyerNote!==undefined?" <span style=color:#ff9800>改</span>":"")+"</span></td>";
h+="<td><span class=note-text "+(o.sellerNote?"":"empty")+" id=note-seller-"+o.platformOrderId+" onclick=editNote('"+o.platformOrderId+"','seller')><span class=flag-dot data-id='" + o.platformOrderId + "' data-type='seller' data-flag='" + sf + "' style='background:"+FLAG_COLORS[sf]+"' onclick='cycleFlag(this.dataset.id,this.dataset.type,parseInt(this.dataset.flag));'></span>"+esc(o.sellerNote||"点击添加")+"</span></td>";
h+="<td><span class=note-text "+(o.systemNote?"":"empty")+" id=note-system-"+o.platformOrderId+" onclick=editNote('"+o.platformOrderId+"','system')><span class=flag-dot data-id='" + o.platformOrderId + "' data-type='system' data-flag='" + syf + "' style='background:"+FLAG_COLORS[syf]+"' onclick='cycleFlag(this.dataset.id,this.dataset.type,parseInt(this.dataset.flag));'></span>"+esc(o.systemNote||"点击添加")+"</span></td>";
h+="</tr>";
}
tb.innerHTML=h;
var allSelected=rows.length>0&&rows.every(function(o){return selectedIds.has(o.platformOrderId);});
document.getElementById("chkAll").checked=allSelected;
}

function updateChangeCount(){
var c=Object.keys(changes).length;
var b=document.getElementById("changeCount");
var btn=document.getElementById("syncBtn");
if(c>0){b.style.display="inline";b.textContent=c+"处修改";btn.disabled=false;}
else{b.style.display="none";btn.disabled=true;}
}

function syncToERP(){
var cl=Object.entries(changes).map(function(e){return Object.assign({orderId:e[0]},e[1]);});
if(!cl.length)return showStatus("没有修改","info");
if(location.protocol==="http:"||location.protocol==="https:"){
var key=localStorage.getItem("syncKey")||"";
if(!key){key=prompt("首次同步需要输入同步密钥（服务器上运行 pm2 logs order-dashboard 查看）")||"";if(!key)return;localStorage.setItem("syncKey",key);}
showStatus("正在同步到风速分销...","info");
fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json","x-sync-key":key},body:JSON.stringify({changes:cl})})
.then(function(r){if(r.status===403){localStorage.removeItem("syncKey");throw new Error("同步密钥错误，请重新点击同步并输入正确密钥");}return r.json();})
.then(function(res){
if(res.ok===false&&!res.results){showStatus(res.msg||"同步失败","error");return;}
var failMsgs=[];
res.results.forEach(function(r2){
if(r2.ok){
var o=RAW_DATA.find(function(x){return x.platformOrderId===r2.orderId;});
var c=changes[r2.orderId];
if(o&&c){Object.keys(c).forEach(function(k){o[k]=c[k];});}
delete changes[r2.orderId];
}else{failMsgs.push(r2.orderId+":"+r2.msg);}
});
updateChangeCount();renderTable();
if(failMsgs.length)showStatus(failMsgs.length+"条未同步："+failMsgs[0],"error");
else showStatus("已同步 "+res.results.length+" 条修改到风速分销","success");
})
.catch(function(e){showStatus(e.message,"error");});
return;
}
var p={action:"sync_notes",changes:cl};
var bl=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});
var u=URL.createObjectURL(bl);
var a=document.createElement("a");a.href=u;a.download="sync_"+Date.now()+".json";a.click();
showStatus("已导出"+cl.length+"条修改（本地文件模式无法直接同步）","success");
}

function showStatus(m,t){var e=document.getElementById("syncStatus");e.textContent=m;e.className="sync-status show sync-"+t;setTimeout(function(){e.className="sync-status";},3000);}

// Events
document.getElementById("btnFilter").onclick=applyFilters;
document.getElementById("btnReset").onclick=resetFilters;
document.getElementById("syncBtn").onclick=syncToERP;

document.getElementById("btnSetSeller").onclick=function(){applyFlag("seller");};
document.getElementById("btnSetSystem").onclick=function(){applyFlag("system");};
document.querySelectorAll(".flag-btn").forEach(function(b){b.onclick=function(){setFlagColor(parseInt(b.dataset.flag));};});
document.getElementById("th0").onclick=function(){sortTable(0);};
document.getElementById("th1").onclick=function(){sortTable(1);};
document.getElementById("th2").onclick=function(){sortTable(2);};
document.getElementById("th3").onclick=function(){sortTable(3);};
document.getElementById("th4").onclick=function(){sortTable(4);};
document.querySelectorAll(".qd").forEach(function(b){b.onclick=function(){setQuickRange(b.dataset.range);};});
document.getElementById("groupFilter").onchange=function(){initStores(this.value);applyFilters();};
document.getElementById("storeFilter").onchange=function(){applyFilters();};

// Init
filteredData=[...RAW_DATA];
initGroups();
initStores("");
setFlagColor(0);
sortAndRender();
var lastUpdateEl=document.getElementById("lastUpdate");
function showLastUpdate(){if(window.LAST_UPDATE&&lastUpdateEl){lastUpdateEl.textContent="更新于 "+window.LAST_UPDATE;}}
showLastUpdate();
function bgRefresh(){
if(Object.keys(changes).length)return;
if(document.activeElement&&document.activeElement.tagName==="TEXTAREA")return;
fetch("dashboard_data.js?t="+Date.now()).then(function(r){return r.text();}).then(function(txt){
var m=txt.match(/window\.RAW_DATA = (\[.*\]);/s);
var mu=txt.match(/window\.LAST_UPDATE = "([^"]*)"/);
if(!m)return;
if(window.LAST_UPDATE&&mu&&mu[1]===window.LAST_UPDATE)return;
var nd=JSON.parse(m[1]);
RAW_DATA.splice(0,RAW_DATA.length);nd.forEach(function(o){RAW_DATA.push(o);});
if(mu)window.LAST_UPDATE=mu[1];
showLastUpdate();
applyFilters();
}).catch(function(){});
}
setInterval(bgRefresh,120000);
</script>
